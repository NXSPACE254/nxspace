# Template only. All operational features default closed.
name = "nxspace-christmas-intake"
main = "src/intake-worker.mjs"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
DEPLOYMENT_MODE = "production-launch"
STAFF_AUTH_MODE = "supabase"
SUPABASE_URL = ""
STAFF_LOGIN_EMAIL_DOMAIN = ""
# Set STAFF_SUPER_LOGIN_EMAIL only with an approved exact address.
STAFF_AUTH_DECOY_EMAIL = ""
INTAKE_ORIGIN = "https://christmas.nxspace.tw"
ACCESS_ISSUER = ""
ACCESS_AUDIENCE = ""
CAMPAIGN_ID = ""
INTAKE_ENCRYPTION_VERSION = "v1"
INTAKE_REQUEST_VERSION = "v1"
FEATURE_INTAKE = "false"
FEATURE_BROWSE = "false"
FEATURE_ADOPT = "false"
FEATURE_FULFILLMENT = "false"
FEATURE_OWNER = "false"
PRIVACY_APPROVED_VERSION = ""
PRIVACY_EFFECTIVE_AT = ""
PRIVACY_CONTROLLER = "卡馜咖啡館"
PRIVACY_CONTACT = "" # 由正式部署配置供核定的公開聯絡方式
PRIVACY_APPROVAL_REF = ""
BOOKHOUSE_DISCLOSURE_REF = ""

[assets]
directory = "./dist/launch"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

